[package]
name = "bts-wasm"
# Private adapter; API/artifact version is always bts::api::version().
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bts = { path = "..", default-features = false }
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "=0.2.126"
# The adapter, not the core, selects the browser entropy backend.
uuid = { version = "1.24.0", features = ["js"] }

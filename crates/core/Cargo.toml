[package]
name = "bts-core"
repository = "https://github.com/zdhrc/bts"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[features]
default = ["native"]
native = ["dep:reqwest", "dep:ring", "dep:tracing-subscriber", "rand/default"]

[dependencies]
bts-lang = { path = "../lang" }
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
rand = { version = "0.9.2", default-features = false, features = ["std"] }
rand_distr = "0.5"
rand_xoshiro = "=0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiktoken-rs = "0.12.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
uuid = { version = "1.24.0", features = ["v4"] }

reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
ring = { version = "0.17", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1.24.0", features = ["js"] }

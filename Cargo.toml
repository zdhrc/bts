[workspace]
members = ["crates/lang", "crates/core", "crates/cli"]
default-members = ["crates/cli"]
resolver = "2"

# release codegen with symbols kept, for samply and friends
[profile.profiling]
inherits = "release"
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

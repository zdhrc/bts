[package]
name = "bts"
repository = "https://github.com/zdhrc/bts"
version = "0.1.6"
edition = "2024"
description = "another synthetics generator"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bts"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["dep:axoupdater", "dep:clap", "dep:reqwest", "dep:ring", "dep:toml", "dep:tracing-subscriber", "rand/thread_rng", "uuid/v4"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "uuid/js", "uuid/v4"]

[dependencies]
axoupdater = { optional = true, version = "0.10.2", default-features = false, features = ["blocking", "github_releases"] }
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { optional = true, version = "4.6.5", features = ["derive"] }
rand = { version = "0.9.2", default-features = false, features = ["std", "small_rng"] }
rand_xoshiro = "0.7.0"
rand_distr = "0.5"
reqwest = { optional = true, version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = { version = "0.17", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
js-sys = { version = "0.3.103", optional = true }
tiktoken-rs = "0.12.0"
toml = { version = "0.9", optional = true }
tracing = "0.1"
tracing-subscriber = { optional = true, version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", default-features = false, features = ["std"] }
wasm-bindgen = { version = "=0.2.126", optional = true }

# release codegen with symbols kept, for samply and friends
[profile.profiling]
inherits = "release"
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

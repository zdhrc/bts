[package]
name = "bts"
repository = "https://github.com/zdhrc/bts"
version = "0.1.0"
edition = "2024"
description = "another synthetics generator"
license = "AGPL-3.0-only"

[dependencies]
axoupdater = { version = "0.10.2", default-features = false, features = ["blocking", "github_releases"] }
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.6.5", features = ["derive"] }
rand = { version = "0.9.2", features = ["small_rng"] }
rand_distr = "0.5"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiktoken-rs = "0.12.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v4"] }

# release codegen with symbols kept, for samply and friends
[profile.profiling]
inherits = "release"
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
